<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Affix/CA — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-void:    #04070f;
      --bg-panel:   rgba(10, 16, 30, 0.82);
      --bg-input:   rgba(8, 14, 28, 0.9);
      --cyan:       #f97316;
      --cyan-dim:   rgba(249, 115, 22, 0.12);
      --cyan-glow:  0 0 24px rgba(249, 115, 22, 0.22);
      --purple:     #f97316;
      --red:        #f43f5e;
      --text:       #dde8f0;
      --text-mid:   #7b9bb8;
      --text-muted: #3d5468;
      --border:     rgba(249, 115, 22, 0.1);
      --radius:     10px;
      --radius-sm:  6px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-void);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    .login-container {
      position: relative; z-index: 1;
      width: 100%; max-width: 400px; padding: 24px;
    }

    .login-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(24px);
      padding: 40px 36px;
      box-shadow: var(--cyan-glow), 0 8px 32px rgba(0,0,0,0.5);
    }

    .login-brand {
      display: flex; align-items: center;
      gap: 14px; margin-bottom: 32px; justify-content: center;
    }

    .login-brand svg { width: 40px; height: 40px; flex-shrink: 0; }

    .login-brand-text { display: flex; flex-direction: column; }

    .login-brand-title {
      font-size: 22px; font-weight: 700;
      background: linear-gradient(135deg, #f97316, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .login-brand-sub {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1.5px; font-weight: 500;
    }

    .login-heading {
      font-size: 15px; font-weight: 500; color: var(--text-mid);
      margin-bottom: 24px; text-align: center;
    }

    .form-group { margin-bottom: 18px; }

    .form-group label {
      display: block; font-size: 12px; font-weight: 500;
      color: var(--text-mid); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit;
      background: var(--bg-input); border: 1px solid var(--border);
      border-radius: var(--radius-sm); color: var(--text);
      outline: none; transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px var(--cyan-dim);
    }

    .btn-login {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 600;
      font-family: inherit;
      background: linear-gradient(135deg, var(--cyan), var(--purple));
      color: #000; border: none; border-radius: var(--radius-sm);
      cursor: pointer; transition: opacity 0.2s ease, transform 0.1s ease;
      margin-top: 8px;
    }

    .btn-login:hover { opacity: 0.9; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

    .login-error {
      display: none;
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px; font-size: 13px; color: var(--red);
      margin-bottom: 16px;
    }

    .login-footer {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M16 2L4 7v8c0 7.18 5.16 13.9 12 15.93C22.84 28.9 28 22.18 28 15V7L16 2z" fill="url(#shieldGrad)"/>
          <path d="M11 16l3.5 3.5L21 12" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="shieldGrad" x1="4" y1="2" x2="28" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#ea580c"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="login-brand-text">
          <span class="login-brand-title">Affix/CA</span>
          <span class="login-brand-sub">Certificate Authority</span>
        </div>
      </div>

      <div class="login-heading">Sign in to continue</div>
      <div class="login-error" id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required autofocus />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login" id="login-btn">Sign In</button>
      </form>

      <div class="login-footer">Secured by Affix/CA PKI</div>
    </div>
  </div>

  <script>
    // Animated background
    (function() {
      const c = document.getElementById('bg-canvas'), ctx = c.getContext('2d');
      let w, h;
      function resize() { w = c.width = window.innerWidth; h = c.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const cols = 40, rows = 25, dots = [];
      for (let i = 0; i < cols * rows; i++)
        dots.push({ x: (i % cols) / cols, y: Math.floor(i / cols) / rows, phase: Math.random() * Math.PI * 2 });
      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (const d of dots) {
          const pulse = 0.3 + 0.7 * ((Math.sin(t / 2000 + d.phase) + 1) / 2);
          ctx.fillStyle = `rgba(249,115,22,${0.04 * pulse})`;
          ctx.beginPath(); ctx.arc(d.x * w, d.y * h, 1.2, 0, Math.PI * 2); ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();

    // Login handler
    (function() {
      const TOKEN_KEY = 'affixca_auth_token';
      const USER_KEY  = 'affixca_auth_user';
      const form  = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');

      // If already authed, redirect
      const existing = localStorage.getItem(TOKEN_KEY);
      if (existing) {
        fetch('/api/auth/session', { headers: { 'Authorization': 'Bearer ' + existing } })
          .then(r => r.json())
          .then(d => { if (d.success) window.location.href = '/'; })
          .catch(() => {});
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.style.display = 'none';
        const btn = document.getElementById('login-btn');
        btn.disabled = true; btn.textContent = 'Signing in\u2026';
        try {
          const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value,
              password: document.getElementById('password').value
            })
          });
          const data = await r.json();
          if (data.success) {
            localStorage.setItem(TOKEN_KEY, data.token);
            localStorage.setItem(USER_KEY, JSON.stringify({ username: data.username, role: data.role }));
            window.location.href = '/';
          } else {
            errEl.textContent = data.message || 'Login failed';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = 'Connection error: ' + err.message;
          errEl.style.display = 'block';
        } finally {
          btn.disabled = false; btn.textContent = 'Sign In';
        }
      });
    })();
  </script>
</body>
</html>
